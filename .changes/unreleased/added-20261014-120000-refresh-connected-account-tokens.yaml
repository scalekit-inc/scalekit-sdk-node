kind: added
body: |
  `scalekit.connectedAccounts.refreshConnectedAccountTokens({ connectedAccountId })` (or `{ connectionName, identifier }`) refreshes a connected account's tokens with its provider (PREVIEW). Call it when a proxy call fails with an auth error, then retry. It returns the account metadata, with the new expiry in `connectedAccount.tokenExpiresAt`. If the provider rejects the refresh, the call fails with `REAUTHENTICATION_NEEDED` and an active account is marked expired. [Reference](https://github.com/scalekit-inc/scalekit-sdk-node/blob/main/AGENTKIT.md)

  ```ts
  const { connectedAccount } =
    await scalekit.connectedAccounts.refreshConnectedAccountTokens({
      connectionName: 'gmail',
      identifier: 'user_123',
    });
  ```
