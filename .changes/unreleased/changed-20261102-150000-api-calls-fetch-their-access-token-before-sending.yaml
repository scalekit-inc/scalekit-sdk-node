kind: changed
body: |
  `ScalekitClient` API calls (organizations, users, connections and the other service clients) now fetch the access token before a client's first call and renew it shortly before it expires, instead of sending without one and retrying after a 401. If Scalekit still rejects the token, the client fetches one new token, shared by concurrent calls, and retries the call once; previously it retried up to three times.
