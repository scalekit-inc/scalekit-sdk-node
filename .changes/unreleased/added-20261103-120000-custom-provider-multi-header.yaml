kind: added
body: |
  `AuthField` now accepts `header_name`, so a custom connector's `API_KEY` auth pattern can send several credentials as separate HTTP headers. Set `header_name` on each field of the pattern; the field's value is then sent as that exact header. Connected accounts for such a connector take one credential per `field_name` in `authorizationDetails.staticAuth.details`. Single-key `API_KEY` connectors are unchanged.

  ```ts
  await scalekit.providers.createCustomProvider({
    displayName: 'My API',
    proxyUrl: 'https://api.example.com',
    authPatterns: [
      {
        type: 'API_KEY',
        display_name: 'API Key',
        fields: [
          { field_name: 'key_id', label: 'Key ID', input_type: 'text', required: true, header_name: 'X-Key-Id' },
          { field_name: 'secret', label: 'Secret', input_type: 'password', required: true, header_name: 'X-Secret' },
        ],
      },
    ],
  });
  ```
