kind: added
body: |
  Custom connectors: `createCustomProvider` and `updateCustomProvider` take a request-level `isMcp`, and `is_mcp` on an `AuthPattern` is now marked `@deprecated` but still works and is still sent. An `isMcp` that conflicts with the pattern's `is_mcp` throws an error naming the pattern. `AuthField` now types `options`, `is_path_param`, `header_name` and the `textarea` input type, and `AuthPattern` types `account_fields` and `allowed_proxy_domains`; `AuthFieldOption` is exported. The method docs and REFERENCE.md now state what the server does: how `displayName` becomes the identifier (which is also the `providerKey` for a connection), what `proxyUrl` is for MCP and API connectors, that `authPatterns` is required in practice, that `description` and `iconSrc` cannot be cleared on update, and that deleting a connector also removes its discovered MCP tools.

  ```ts
  await scalekit.actions.providers.createCustomProvider({
    displayName: 'Acme MCP',
    proxyUrl: 'https://mcp.acme.com/mcp',
    isMcp: true, // replaces is_mcp: true on the pattern
    authPatterns: [{ type: 'OAUTH', display_name: 'Acme OAuth', oauth_config: {} }],
  });
  ```
