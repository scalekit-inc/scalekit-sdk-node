kind: added
body: |
  Documentation for connected accounts, tool calling and virtual MCP: `connectionName` (`connector` on `executeTool` and the lower layers) is now described as the connection's own name (for example `slack-b1fqL2Dr`, not the provider's name) and `identifier` as the identifier the connected account was created with, in the same words everywhere. `executeTool` now documents which connected account is used (`identifier` alone is enough when it matches one account on the tool's provider) and the errors you get. `getAuthorizationLink` is described as the way to create or re-authorize a connected account, and `getConnectedAccount` is flagged as returning credentials. `REFERENCE.md` gains the missing `executeTool` section, `AGENTKIT.md` lists every `actions` method, and `AGENTKIT.md` gains a short "how the pieces fit together" flow, a note on which namespace to use, and a virtual MCP section pointing to the reference. No code changes.
