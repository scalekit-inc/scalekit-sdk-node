kind: added
body: |
  `scalekit.actions.triggers` now manages AgentKit triggers: list a connection's triggers and eligible accounts, create and delete subscriptions singly or in batches, set up the webhook URL and rotate its signing secret, read activity and usage, and inspect, resend or recover deliveries. Results are typed objects with `Date` times and string enums, each of these methods takes an optional `{ signal, timeoutMs }`, and calls that could apply twice are not retried. [Reference](https://github.com/scalekit-inc/scalekit-sdk-node/blob/v2.22.0/REFERENCE.md#triggers)

  ```ts
  const triggers = scalekit.actions.triggers;
  const { accounts } = await triggers.listEligibleAccounts('conn_123', 'example.item.created');
  const { results } = await triggers.batchCreateSubscriptions('conn_123', 'example.item.created', {
    connectedAccountIds: accounts.filter((a) => a.eligible).map((a) => a.id),
  });
  for (const r of results) console.log(r.connectedAccountId, r.outcome); // CREATED, REFUSED, ...
  ```
