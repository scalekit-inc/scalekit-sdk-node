kind: added
body: |
  `scalekit.actions.mcp.createSessionToken({ connectionName, identifier, expirySeconds?, accessLevel? })` mints a session token for a connection's own MCP server (`<environment URL>/mcp/v3/connections/<connection name>`), which serves all of that connection's tools without an MCP configuration. Pass `connectionName` instead of `mcpConfigId`; if both are set, `mcpConfigId` is used. Existing `mcpConfigId` calls are unchanged. For either target, `accessLevel: 'READ_ONLY'` limits the token to read-only tools. The URL path is case-sensitive, so connect with the connection's name exactly as stored. [Reference](https://github.com/scalekit-inc/scalekit-sdk-node/blob/main/REFERENCE.md#virtual-mcp-servers)

  ```ts
  const session = await scalekit.actions.mcp.createSessionToken({
    connectionName: 'gmail',
    identifier: 'user_123',
    expirySeconds: 900,
    accessLevel: 'READ_ONLY',
  });
  const headers = { Authorization: `Bearer ${session.token}` };
  ```
