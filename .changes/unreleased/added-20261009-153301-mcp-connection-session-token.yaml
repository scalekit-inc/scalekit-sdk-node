kind: added
body: |
  `scalekit.actions.mcp.createConnectionSessionToken(params)` mints a session token for a connection's own MCP server (`/mcp/v3/connections/<connection name>`, built from the connection's stored name), which exposes all of that connection's tools without an MCP configuration. It takes the same `identifier`, `expirySeconds` and `accessLevel` as `createSessionToken`. [Reference](https://github.com/scalekit-inc/scalekit-sdk-node/blob/main/REFERENCE.md#virtual-mcp-servers)

  ```ts
  const session = await scalekit.actions.mcp.createConnectionSessionToken({
    connectionName: 'gmail',
    identifier: 'user_123',
    expirySeconds: 900,
    accessLevel: 'READ_ONLY',
  });
  ```
