kind: added
body: |
  `scalekit.actions.searchConnectedAccounts({ query, pageSize?, pageToken?, connectionId? })` searches the environment's connected accounts by text, matched case-insensitively against identifier, provider and connector, with paging and an optional connection filter. It returns a `SearchConnectedAccountsResponse` with `connectedAccounts`, `totalSize`, `nextPageToken` and `prevPageToken`. `scalekit.connectedAccounts.searchConnectedAccounts` takes the same parameters. [Reference](https://github.com/scalekit-inc/scalekit-sdk-node/blob/main/REFERENCE.md#actions)

  ```ts
  const page = await scalekit.actions.searchConnectedAccounts({ query: 'gmail', pageSize: 10 });
  for (const account of page.connectedAccounts) {
    console.log(account.identifier, account.connector, account.status);
  }
  ```
