kind: fixed
body: |
  `scalekit.actions.request` no longer fails with a 401 ("missing authorization header") when it is a client's first call, or after the client's access token expires: the client now fetches its token before the first request and renews it shortly before it expires. If Scalekit still rejects the token, the request is sent once more with a new one; a 401 from the provider is never resent.
