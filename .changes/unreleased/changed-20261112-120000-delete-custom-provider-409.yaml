kind: changed
body: |
  `scalekit.actions.providers.deleteCustomProvider` now fails with `ScalekitConflictException` (error code `RESOURCE_ALREADY_EXISTS`) and deletes nothing while a tool collection run of a connector created from an OpenAPI spec is queued or processing. Wait for the run with `scalekit.actions.providers.getToolCollectionRun`, then call again once it has finished. [Reference](https://github.com/scalekit-inc/scalekit-sdk-node/blob/main/REFERENCE.md#custom-connectors)
time: '2026-11-12T12:00:00.000000+00:00'
custom:
