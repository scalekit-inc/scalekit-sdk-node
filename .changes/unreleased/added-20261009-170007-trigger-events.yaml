kind: added
body: |
  `verifyTriggerEvent({ body, headers, secret })` and `scalekit.actions.triggers.verifyEvent(params)` verify a trigger event delivered to your endpoint (signature first, 5-minute timestamp tolerance) and return it as a typed `TriggerEvent`; the standalone function needs no client. A body that is signed correctly but is not a readable trigger event throws `ScalekitTriggerEventParseError`, which extends `WebhookVerificationError`. [Reference](https://github.com/scalekit-inc/scalekit-sdk-node/blob/main/REFERENCE.md#trigger-events)

  ```ts
  import { verifyTriggerEvent, DeliveryScope, WebhookVerificationError } from '@scalekit-sdk/node';

  try {
    const event = verifyTriggerEvent({ body: req.body, headers: req.headers, secret: process.env.SCALEKIT_TRIGGER_SECRET! });
    const accountId = event.deliveryScope === DeliveryScope.ACCOUNT ? event.connectedAccountId : undefined;
    // de-duplicate on event.dedupeKey + the connected account you act as
  } catch (err) {
    if (err instanceof WebhookVerificationError) res.sendStatus(400);
  }
  ```
