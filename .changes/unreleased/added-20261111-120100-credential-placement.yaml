kind: added
body: |
  `AuthField` now accepts `placement`, so a custom connector can send a static credential in the URL path, the query string or the JSON body instead of an HTTP header. Set `placement: { in: 'path' | 'query' | 'body', name }` on the credential field of an `API_KEY` (`api_key`), `BEARER` (`token`) or `BASIC` (`username` and `password`) pattern. Scalekit checks the rules when you create or update the connector, for example that a placed credential uses `input_type: 'password'` and that a `path` placement has its `{{name}}` placeholder in the path of `proxyUrl`, and rejects a violation with `[invalid_argument] invalid credential placement: ...`. A placed credential is not also sent as a header. Existing connectors are unchanged. [Reference](https://github.com/scalekit-inc/scalekit-sdk-node/blob/main/REFERENCE.md#where-the-credential-is-sent)

  ```ts
  await scalekit.actions.providers.createCustomProvider({
    displayName: 'Acme Query Key',
    proxyUrl: 'https://api.acme.example.com',
    authPatterns: [
      {
        type: 'API_KEY',
        display_name: 'API Key',
        fields: [
          {
            field_name: 'api_key',
            label: 'API Key',
            input_type: 'password',
            required: true,
            placement: { in: 'query', name: 'token' }, // sent as ?token=<credential>
          },
        ],
      },
    ],
  });
  ```
