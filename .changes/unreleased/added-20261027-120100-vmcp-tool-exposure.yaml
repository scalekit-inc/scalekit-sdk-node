kind: added
body: |
  `scalekit.actions.mcp.createConfig({ ..., toolExposure })` and `updateConfig({ ..., toolExposure })` take `'DIRECT'` or `'META'`. `DIRECT` (the default) lists every mapped tool and allows at most 25 connections; `META` gives agents five search and execute tools with no connection limit and must be enabled for your environment. Existing code keeps working: leave `toolExposure` out and you get `DIRECT`, and an update that omits it never changes the stored mode. [Reference](https://github.com/scalekit-inc/scalekit-sdk-node/blob/main/REFERENCE.md#virtual-mcp-servers)

  ```ts
  const res = await scalekit.actions.mcp.createConfig({
    name: 'support-agent',
    connectionToolMappings: [{ connectionName: 'gmail' }],
    toolExposure: 'META',
  });
  await scalekit.actions.mcp.updateConfig({ configId: res.config!.id, toolExposure: 'DIRECT' });
  ```
