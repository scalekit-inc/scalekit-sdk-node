kind: added
body: |
  New `ScalekitClient` option `scalekitTokenErrors`. When it is `true`, a failed access-token request during a service call such as `scalekit.organization.listOrganization` (a wrong client secret, an unreachable token endpoint) throws a `ScalekitException`, the same subclass `scalekit.actions.request` throws, instead of a raw `AxiosError`. The exception keeps `isAxiosError`, `response`, `code`, `status` and `config`, and the original error as `cause`. The default, `false`, keeps today's behaviour; the next major release makes `true` the only behaviour. [Reference](https://docs.scalekit.com/apis)
time: '2026-11-02T16:00:00.000000+00:00'
