kind: added
body: |
  The AgentKit docs now cover the connection of a custom connector. The connections of a custom connector are AgentKit connections: create one with `scalekit.actions.createConnection({ provider, connectionName, authMode, providerDomain })`, where `provider` is the custom connector's `provider.identifier` (`NAME:environment-id`, not `provider.id`), and set its OAuth credentials and token endpoint options with `scalekit.actions.updateConnection({ connectionId, oauth })`. `providerDomain` is the host name that replaces `{{domain}}` in the `proxyUrl` of a custom MCP connector whose URL is a template; you set it when you create the connection, and it cannot be changed later and is not returned. `oauth.tokenEndpointAuthMethod` sets how Scalekit sends the client credentials to the provider's token endpoint: `'BASIC_AUTH'` sends them in an HTTP Basic header, `'REQUEST_BODY'` as POST body parameters, `'NONE'` is for public or PKCE clients (it sends no client secret on an MCP token refresh, and on the authorization code exchange only when the connection has no client secret stored, since a stored secret is still sent), and `'DEFAULT'` lets Scalekit choose. Set one only when the provider's token endpoint documentation names it: a wrong value makes new authorizations fail, and on an MCP connection it also makes token refresh fail, so each connected account has to authenticate again when its token is next refreshed. Leave it out to keep the stored value. The methods and options themselves are unchanged. [Reference](https://github.com/scalekit-inc/scalekit-sdk-node/blob/main/AGENTKIT.md#connect-a-custom-connector)

  ```ts
  const connection = await scalekit.actions.createConnection({
    provider: 'ACMEAPI:70219645518265104', // the custom connector
    connectionName: 'acme-mcp',
    authMode: 'USER',
    providerDomain: 'mcp.eu.acme.example.com', // replaces {{domain}} in the connector's proxyUrl
  });

  const result = await scalekit.actions.updateConnection({
    connectionId: connection.id, // or connectionName: 'acme-mcp'
    oauth: {
      clientId: process.env.ACME_CLIENT_ID!,
      clientSecret: process.env.ACME_CLIENT_SECRET!,
      scopes: ['read', 'write'],
      tokenEndpointAuthMethod: 'BASIC_AUTH',
    },
  });
  console.log(result.id);
  ```
