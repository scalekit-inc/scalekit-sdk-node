# Release configuration read by scripts/release/release.py.
[project]
name = "scalekit-sdk-node"
repo = "scalekit-inc/scalekit-sdk-node"
language = "node"

[[version_files]]
path = "package.json"
json_pointers = ["/version"]

[[version_files]]
path = "package-lock.json"
json_pointers = ["/version", "/packages//version"]

[release]
install = "npm install @scalekit-sdk/node@{version}"

[paths]
shipped = ["src/*", "lib/*", "package.json", "package-lock.json"]
